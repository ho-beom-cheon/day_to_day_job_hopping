# Isolated browser acceptance environment. Never combine with the public overlay.
name: daily-career-course-qa
services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:5a1b083da321ba67c86c3169d22778c561fa0935f17acbff7bbc0537f1e50dd6
    environment:
      POSTGRES_DB: course_qa
      POSTGRES_USER: course_qa
      POSTGRES_PASSWORD: ${COURSE_QA_PASSWORD:?Set COURSE_QA_PASSWORD in the private QA env file}
    volumes: [course-qa-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_qa -d course_qa"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: daily-career-backend-course-20260926
    command: ["java", "-jar", "/workspace/target/daily-career-0.0.1-SNAPSHOT.jar"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/course_qa
      DATABASE_USER: course_qa
      DATABASE_PASSWORD: ${COURSE_QA_PASSWORD:?Set COURSE_QA_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      SESSION_COOKIE_SECURE: "false"
      DEV_AUTH_BYPASS: "true"
      DEV_AUTH_USER_ID: "1"
      APP_ORIGIN: http://localhost:18081
    healthcheck:
      test: ["CMD", "java", "-cp", "/workspace/target/classes", "dev.dailycareer.infrastructure.HealthProbe"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, target: runtime}
    environment:
      BACKEND_HEALTH_URL: http://backend:9090/actuator/health
      NGINX_ORIGIN: http://nginx
      DEV_AUTH_BYPASS: "true"
      APP_HTTPS_HOST: ""
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      APP_DOMAIN: localhost
      APP_HTTPS_HOST: ""
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|APP_HTTPS_HOST)$
    ports: ["127.0.0.1:18081:80"]
    volumes: ["./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro"]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
volumes:
  course-qa-data:
