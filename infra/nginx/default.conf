log_format auth_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
map $host $app_forwarded_scheme {
    default $scheme;
    # Explicit TLS host served by the local HTTPS proxy; do not trust client-supplied forwarding headers.
    "${APP_HTTPS_HOST}" https;
}
server {
    listen 80;
    server_name ${APP_DOMAIN};
    server_tokens off;

    # Management is container-internal, never a public API.
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }

    location ~ ^/(oauth2/authorization/google|login/oauth2/code/google|api/v1/integrations/notion/callback|api/v1/integrations/browser/(slack|openrouter)/callback)$ {
        access_log /var/log/nginx/access.log auth_safe;
        # Nginx error messages can include the complete callback query. Status remains in auth_safe.
        error_log /dev/null;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache off;
    }

    location / {
        proxy_pass http://frontend:3000;
        # Next.js development HMR uses a WebSocket through the existing proxy.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $app_forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
