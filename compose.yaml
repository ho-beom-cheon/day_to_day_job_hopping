name: ${COMPOSE_PROJECT_NAME:-daily-career-dev}
services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:5a1b083da321ba67c86c3169d22778c561fa0935f17acbff7bbc0537f1e50dd6
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-daily_career}
      POSTGRES_USER: ${DATABASE_USER:-daily_career}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-daily_career}
      DATABASE_USER: ${DATABASE_USER:-daily_career}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      DEV_AUTH_USER_ID: ${DEV_AUTH_USER_ID:-}
      AI_PROVIDER_ENDPOINT: ${AI_PROVIDER_ENDPOINT:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-}
      AI_PROVIDER_TYPE: ${AI_PROVIDER_TYPE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      INTEGRATION_CREDENTIAL_KEY: ${INTEGRATION_CREDENTIAL_KEY:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      OPENROUTER_REDIRECT_URI: ${OPENROUTER_REDIRECT_URI:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      APP_WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      APP_WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      APP_WEB_PUSH_SUBSCRIPTION_KEY: ${WEB_PUSH_SUBSCRIPTION_KEY:-}
      APP_WEB_PUSH_KEY_ID: ${WEB_PUSH_KEY_ID:-}
      APP_WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      APP_WEB_PUSH_ALLOWED_HOSTS: ${WEB_PUSH_ALLOWED_HOSTS:-}
      APP_SLACK_CREDENTIAL_REF: ${SLACK_CREDENTIAL_REF:-}
      APP_SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APP_SLACK_CHANNEL_NAME: ${SLACK_CHANNEL_NAME:-}
      APP_SLACK_ALLOWED_HOSTS: ${SLACK_ALLOWED_HOSTS:-hooks.slack.com,hooks.slack-gov.com}
      APP_NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      APP_NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      APP_NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-}
      APP_NOTION_CREDENTIAL_KEY: ${NOTION_CREDENTIAL_KEY:-}
      APP_NOTION_KEY_ID: ${NOTION_KEY_ID:-notion-local-v1}
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/probe", "dev.dailycareer.infrastructure.HealthProbe"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: development
      additional_contexts:
        course_examples: ./content/java-four-week-v1/examples
    volumes:
      # Bind only source: host node_modules and .next never enter the container.
      - ./frontend/src:/app/src:ro
    environment:
      BACKEND_HEALTH_URL: http://backend:9090/actuator/health
      NGINX_ORIGIN: http://nginx
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      APP_HTTPS_HOST: ${APP_HTTPS_HOST:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 12
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_HTTPS_HOST: ${APP_HTTPS_HOST:-}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|APP_HTTPS_HOST)$
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
    name: ${DB_VOLUME_NAME:-daily-career-dev-postgres}
